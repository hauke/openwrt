name: Claude Code Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  code-review:
    name: Claude Code Review
    # Only run on PR comments containing "/claude" from users with write access
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: PR Review
        uses: hauke/claude-code-action@4b02932d50b8a67602e46aaea77c8d2f00a6b55e # v1.0.93-fixed
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "/claude"
          include_fix_links: false
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*)"
        env:
          APPEND_SYSTEM_PROMPT: >-
            Use inline comments (create_inline_comment) for issues tied to a
            specific file and line. Use a top-level PR comment only for a
            high-level summary. Keep comments short and to the point.
