name: SBOM report

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to scan (e.g. openwrt-25.12). Leave empty to use the branch this workflow was launched from.'
        type: string
        default: ''
      skip_publish:
        description: 'Skip publishing to Pages'
        type: boolean
        default: false
      skip_versions:
        description: 'Skip the Repology/endoflife.date version scan (slow)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate SBOM report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install host prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses-dev \
            libssl-dev python3 python3-dev python3-setuptools python3-pip \
            rsync subversion swig time xsltproc zlib1g-dev unzip wget jq

      - name: Install Python dependencies
        run: python3 -m pip install --user jinja2

      - name: Generate SBOM (all packages, metadata only)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make prepare-tmpinfo
          mkdir -p sbom-work
          ./scripts/package-metadata.pl allpkgcyclonedxsbom tmp/.packageinfo \
            > sbom-work/sbom.cdx.json
          SBOM_REF="${{ inputs.ref || github.ref_name }}"
          SBOM_SHA="$(git rev-parse --short=8 HEAD)"
          echo "SBOM_SOURCE=openwrt all-packages metadata (${SBOM_REF} @ ${SBOM_SHA})" \
            >> "$GITHUB_ENV"
          python3 -c "import json; d=json.load(open('sbom-work/sbom.cdx.json')); print('Generated SBOM with', len(d['components']), 'components')"

      # OSV-Scanner is pinned by SHA256. Update OSV_VERSION and OSV_SHA256
      # together; the expected hash is published at
      #   https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_SHA256SUMS
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: "2.3.5"
          OSV_SHA256: "bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b"
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Compute weekly cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Repology cache
        uses: actions/cache@v5
        with:
          path: .cache/repology.json
          key: repology-cache-${{ steps.week.outputs.week }}
          restore-keys: |
            repology-cache-

      - name: Checkout NVD mirror
        uses: actions/checkout@v6
        with:
          repository: fkie-cad/nvd-json-data-feeds
          path: .cache/nvd/git
          fetch-depth: 1
          persist-credentials: false

      - name: NVD mirror status
        run: du -sh .cache/nvd/git

      - name: Scan SBOM against NVD
        run: |
          python3 .github/sbom-report/scan_cves.py \
            --sbom sbom-work/sbom.cdx.json \
            --nvd-dir .cache/nvd \
            --out-cves sbom-work/cves.json \
            --out-sbom sbom-work/sbom-enriched.json \
            --only-with-cpe

      - name: Scan with OSV-Scanner (secondary, best-effort)
        continue-on-error: true
        run: |
          osv-scanner -L sbom-work/sbom.cdx.json --format=json \
            --output-file=sbom-work/osv.json || true
          if [ -s sbom-work/osv.json ]; then
            jq '.results | length' sbom-work/osv.json
          fi

      - name: Check versions (Repology + endoflife.date)
        if: ${{ github.event_name == 'schedule' || inputs.skip_versions != true }}
        run: |
          python3 .github/sbom-report/check_versions.py \
            --sbom sbom-work/sbom.cdx.json \
            --out sbom-work/versions.json \
            --cache .cache/repology.json

      - name: Skip versions — write empty placeholder
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_versions == true }}
        run: |
          echo '{"outdated": [], "eol": []}' > sbom-work/versions.json

      - name: Render HTML report
        run: |
          python3 .github/sbom-report/render.py \
            --sbom sbom-work/sbom.cdx.json \
            --cves sbom-work/cves.json \
            --osv sbom-work/osv.json \
            --versions sbom-work/versions.json \
            --templates .github/sbom-report/templates \
            --out public \
            --sbom-source "${SBOM_SOURCE:-unknown}"
          cp sbom-work/sbom-enriched.json public/sbom.cdx.json

      - name: Upload report artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: sbom-report
          path: public/
          retention-days: 30

      - name: Determine ref slug
        if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
        id: slug
        run: |
          SLUG="${{ inputs.ref || github.ref_name }}"
          SLUG="${SLUG//\//-}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Fetch existing Pages state
        if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git checkout -b gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

      - name: Merge new report into Pages state
        if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          rm -rf "site/${SLUG}"
          mkdir -p "site/${SLUG}"
          cp -r public/. "site/${SLUG}/"
          python3 - <<'PY'
          import os, html
          base = 'site'
          entries = sorted(
              e for e in os.listdir(base)
              if os.path.isdir(os.path.join(base, e)) and not e.startswith('.')
          )
          with open(os.path.join(base, 'index.html'), 'w') as f:
              f.write('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
                      '<title>OpenWrt SBOM Reports</title></head><body>'
                      '<h1>OpenWrt SBOM Reports</h1><ul>')
              for e in entries:
                  f.write(f'<li><a href="{html.escape(e)}/">{html.escape(e)}</a></li>')
              f.write('</ul></body></html>')
          PY

      - name: Commit Pages state to gh-pages
        if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
        working-directory: site
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "SBOM report: update ${{ steps.slug.outputs.slug }}"
            git push origin HEAD:gh-pages
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    if: ${{ github.event_name == 'schedule' || inputs.skip_publish != true }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
